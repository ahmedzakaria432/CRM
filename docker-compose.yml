# The whole CRM in containers: SQL Server, Redis and the Aspire dashboard (from backend/docker-compose.yml), the API,
# the Nuxt app, and nginx in front of both on one origin.
#
#   docker compose up -d --build        then open http://localhost:8080  (portal: /portal/login, staff: /login)
#
# This is a local demo stack, not a production deployment: the API runs as Development, so it migrates every module,
# seeds the dev users (password Crm_Dev_2026!) and serves Swagger at /swagger.
#
# The project is named "backend" on purpose - the same project as `cd backend && docker compose up -d` - so both
# commands share the crm-sqlserver / crm-redis containers and the backend_crm-sqldata volume instead of clashing on
# container names.
name: backend

include:
  - backend/docker-compose.yml

services:
  api:
    build: ./backend
    image: crm-api
    container_name: crm-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Crm: "Server=sqlserver,1433;Database=Crm;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Crm_Local_Dev_2026!};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=2000,asyncTimeout=2000,syncTimeout=2000"
      OpenTelemetry__OtlpEndpoint: "http://aspire-dashboard:18889"
      Diagnostics__SelfBaseUrl: "http://localhost:8080/"
      # Behind nginx every browser shares one remote IP (and SSR calls come from the web container), so the
      # Development per-IP Public limit (5 per 30 s) would trip on normal browsing.
      RateLimiting__Public__PermitLimit: "600"
      RateLimiting__Public__Window: "00:01:00"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    image: crm-web
    container_name: crm-web
    environment:
      NUXT_API_BASE: "http://api:8080" # server-side (SSR) API origin; the browser uses same-origin /api via nginx
      NUXT_PUBLIC_ORGANISATION_CODE: "${CRM_ORGANISATION_CODE:-DEMO}"
    depends_on:
      - api

  proxy:
    image: nginx:1.27-alpine
    container_name: crm-proxy
    ports:
      - "${CRM_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
