services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Crm_Local_Dev_2026!}"
      MSSQL_PID: Developer
    ports:
      # Remapped from the default 1433 - already bound on this machine by another project's
      # SQL Server container. See backend/README.md.
      - "14330:1433"
    volumes:
      - crm-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  redis:
    image: redis:7.4-alpine
    container_name: crm-redis
    ports:
      # Remapped like SQL Server - 6379 is commonly taken on shared dev machines.
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  aspire-dashboard:
    # Local OpenTelemetry viewer: traces, metrics, and structured logs (Story 03).
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: crm-telemetry
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true" # local dev only
    ports:
      - "18888:18888" # dashboard UI
      - "14317:18889" # OTLP/gRPC ingest (OpenTelemetry:OtlpEndpoint)

volumes:
  crm-sqldata:
