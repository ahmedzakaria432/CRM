# One origin for the browser: /api goes to Crm.Api, everything else to Nuxt (nuxt.config.ts: the browser calls
# same-origin /api, so the API needs no CORS policy).
server {
    listen 80;
    client_max_body_size 2m; # branding logo uploads are capped at 512 KB by the domain

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api:8080;
    }

    # Development-only on the API side (Swagger UI and documents) and the health probes.
    location /swagger {
        proxy_pass http://api:8080;
    }

    location /health {
        proxy_pass http://api:8080;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
